spring:
  application:
    name: hoka-bo-api
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  flyway:
    # appdb를 FO·배치와 함께 쓰므로 이력 테이블 이름을 BO 전용으로 둔다.
    table: bo_flyway_schema_history
  mvc:
    problemdetails:
      enabled: true

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

# 기본값을 두지 않는다. 로컬은 application-local.yaml, 그 외 환경은 환경변수로 준다.
hoka:
  jwt:
    secret: ${BO_JWT_SECRET}
  admin:
    email: ${BO_ADMIN_EMAIL}
    password: ${BO_ADMIN_PASSWORD}
  front:
    base-url: ${BO_FRONT_BASE_URL}
