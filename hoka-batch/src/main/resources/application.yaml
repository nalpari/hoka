spring:
  application:
    name: hoka-batch
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/appdb}
    username: ${DB_USERNAME:app}
    password: ${DB_PASSWORD:app}
  batch:
    jdbc:
      # 로컬은 BATCH_* 메타 테이블을 자동 생성한다.
      # 운영은 SPRING_BATCH_JDBC_INITIALIZE_SCHEMA=never 로 끄고 schema-postgresql.sql 을 직접 적용한다.
      initialize-schema: always

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
